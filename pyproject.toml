[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arenax-robotics"
version = "0.1.0"
description = "ArenaX Robotics: robot terrain and policy validation in MuJoCo"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "mujoco>=3.0",
  "PyQt5>=5.15",
  "onnxruntime>=1.18",
  "PyYAML>=6.0",
  "glfw>=2.7",
]

[project.scripts]
arenax = "terrain_generator.cli:main"
mujoco-terrain = "terrain_generator.cli:main"

[tool.setuptools.packages.find]
include = ["terrain_generator*"]
